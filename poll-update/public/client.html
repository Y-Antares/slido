<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>提问互动</title>
    <style>
        :root {
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --border: #E4E8EE;
            --accent: #4A90D9;
            --accent-hover: #3A7BC8;
            --text: #1A2332;
            --text-secondary: #6F7B8C;
            --font: Arial, 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .form-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 440px;
        }
        h1 {
            text-align: center;
            margin: 0 0 6px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
        }
        .subtitle {
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .input-group { margin-bottom: 14px; }
        input[type="text"] {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            font-family: var(--font);
        }
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.12);
        }
        input::placeholder { color: var(--text-secondary); }
        .textarea-container { position: relative; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 140px;
            padding: 14px;
            padding-bottom: 48px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: all 0.2s ease;
            font-family: var(--font);
        }
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.12);
        }
        textarea::placeholder { color: var(--text-secondary); }

        .mic-btn {
            position: absolute;
            right: 10px; bottom: 10px;
            border: 1px solid var(--border);
            background-color: #FFFFFF;
            color: var(--text-secondary);
            border-radius: 20px;
            padding: 7px 14px;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-family: var(--font);
        }
        .mic-btn:hover { border-color: var(--accent); color: var(--accent); }
        .mic-btn.recording { background-color: #EF4444; color: white; border-color: #EF4444; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            background-color: var(--accent);
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            font-family: var(--font);
        }
        button[type="submit"]:hover { background-color: var(--accent-hover); }
        button[type="submit"]:active { transform: scale(0.98); }

        .message { text-align: center; color: var(--accent); margin-top: 15px; font-weight: 500; font-size: 0.92rem; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>问得好</h1>
        <p class="subtitle">留下你的问题</p>
        <form id="question-form">
            <div class="input-group">
                <input type="text" maxlength="100" id="name-input" placeholder="你的名字（选填）">
            </div>
            <div class="textarea-container">
                <textarea maxlength="10000" id="question-input" placeholder="在此输入你想探讨的内容..." required></textarea>
                <button type="button" id="mic-btn" class="mic-btn">语音输入</button>
            </div>
            <button type="submit">立即提交</button>
        </form>
        <p id="message" class="message"></p>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const sessionCode = pathParts[pathParts.length - 2];

        const form = document.getElementById('question-form');
        const nameInput = document.getElementById('name-input');
        const questionInput = document.getElementById('question-input');
        const messageEl = document.getElementById('message');
        const micBtn = document.getElementById('mic-btn');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        micBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstart = () => {
                        isRecording = true;
                        micBtn.textContent = '录音中...';
                        micBtn.classList.add('recording');
                    };

                    mediaRecorder.onstop = async () => {
                        micBtn.textContent = '识别中...';
                        micBtn.classList.remove('recording');
                        micBtn.disabled = true;

                        const audioBlob = new Blob(audioChunks);
                        const formData = new FormData();
                        formData.append('audio', audioBlob, 'record.webm');

                        try {
                            const response = await fetch('/api/voice-to-text', {
                                method: 'POST',
                                body: formData
                            });
                            const data = await response.json();
                            if (response.ok) {
                                questionInput.value += data.text;
                            } else {
                                alert(data.message || '识别失败');
                            }
                        } catch (err) {
                            alert('网络请求失败');
                        } finally {
                            isRecording = false;
                            micBtn.textContent = '语音输入';
                            micBtn.disabled = false;
                        }
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                } catch (err) {
                    alert('获取麦克风权限失败');
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
            }
        });

        let submitting = false;
        const submitButton = form.querySelector('button[type="submit"]');
        // 同一浏览器跨场次复用身份；不使用姓名或 IP 作为新记录的人员标识。
        function getParticipantId() {
            let id;
            try { id = localStorage.getItem('poll_participant_id_v1'); } catch (_) {}
            if (!/^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/i.test(id || '')) {
                id = crypto.randomUUID();
                localStorage.setItem('poll_participant_id_v1', id);
            }
            return id;
        }
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (submitting) return;
            const question = questionInput.value.trim();
            const name = nameInput.value.trim();
            if (!question) return;
            submitting = true;
            submitButton.disabled = true;
            submitButton.textContent = '提交中…';
            messageEl.textContent = '';
            try {
                let participantId;
                try { participantId = getParticipantId(); }
                catch (_) { throw new Error('请允许浏览器保存网站数据，并使用 HTTPS 打开页面后再提交。'); }
                const response = await fetch(`/api/ask/${sessionCode}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, name, participantId })
                });
                const result = await response.json();
                if (response.status === 409 && result.code === 'DUPLICATE_QUESTION') {
                    messageEl.textContent = result.message;
                    messageEl.style.color = '#EF4444';
                    return;
                }
                if (!response.ok) throw new Error(result.message || '提交失败');
                // 保存失败不能把服务器已成功接收的提交显示成失败。
                try {
                    const storageKey = `submitted_questions_${sessionCode}`;
                    let list = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    if (!Array.isArray(list)) list = [];
                    list.push({ question, name, time: new Date().toISOString() });
                    localStorage.setItem(storageKey, JSON.stringify(list));
                } catch (_) {}
                window.location.href = `/session/${sessionCode}/success?dup=0`;
            } catch (error) {
                messageEl.textContent = `❌ ${error.message}`;
                messageEl.style.color = '#EF4444';
            } finally {
                submitting = false;
                submitButton.disabled = false;
                submitButton.textContent = '立即提交';
            }
        });
    </script>
</body>
</html>

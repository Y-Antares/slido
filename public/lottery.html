<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>互动气泡抽奖</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #F5F7FA;
            --text: #1A2332;
            --text-secondary: #6F7B8C;
            --accent: #4A90D9;
            --border: #E4E8EE;
            --radius: 10px;
            --font: Arial, 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0; background-color: var(--bg); color: var(--text);
            font-family: var(--font); overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }
        .header {
            padding: 18px; z-index: 10; text-align: center;
            background: #FFFFFF; width: 100%;
            border-bottom: 1px solid var(--border);
        }
        .header h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        select {
            padding: 7px 12px; border-radius: 8px; background: #FFFFFF;
            color: var(--text); border: 1px solid var(--border); font-family: var(--font);
            font-size: 0.88rem;
        }
        select:focus { border-color: var(--accent); outline: none; }
        canvas { position: absolute; top: 0; left: 0; cursor: pointer; }
        .ui-layer {
            position: absolute; bottom: 40px; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
        }
        button#action-btn {
            padding: 14px 36px; font-size: 1.1rem; font-weight: 700;
            background: var(--accent); color: white; border: none;
            border-radius: 50px; cursor: pointer; font-family: var(--font);
            box-shadow: 0 4px 16px rgba(74,144,217,0.3);
            transition: all 0.15s;
        }
        button#action-btn:hover { background: #3A7BC8; }
        #result-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #FFFFFF; color: var(--text);
            padding: 36px; border-radius: 16px; width: 88%; max-width: 560px;
            text-align: center; z-index: 100; border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        #result-modal h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; }
        .btn-link {
            background: var(--accent); color: white; text-decoration: none;
            padding: 10px 20px; border-radius: 8px; margin: 8px;
            display: inline-block; font-weight: 600; font-size: 0.9rem;
            transition: all 0.15s;
        }
        .btn-link:hover { background: #3A7BC8; }
        .btn-secondary {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 10px 20px; border-radius: 8px; margin: 8px;
            display: inline-block; font-weight: 600; font-size: 0.9rem;
            text-decoration: none; cursor: pointer; transition: all 0.15s;
        }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="session-title">正在加载...</h2>
        日期：<select id="date-selector"></select>
    </div>

    <canvas id="ballCanvas"></canvas>

    <div class="ui-layer">
        <button id="action-btn">开始碰撞</button>
    </div>

    <div id="result-modal">
        <h1 style="color: #4A90D9;">恭喜这位同学！</h1>
        <div id="lucky-text" style="font-size: 1.4rem; margin: 20px 0; line-height: 1.5;"></div>
        <div id="lucky-name" style="color: #4A90D9; font-size: 1.1rem; font-weight: bold;"></div>
        <div style="margin-top: 20px;">
            <a href="#" id="jump-btn" class="btn-link">去展示墙</a>
            <button onclick="location.reload()" class="btn-secondary">再抽一次</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ballCanvas');
        const ctx = canvas.getContext('2d');
        const urlParams = new URLSearchParams(window.location.search);
        const sessionCode = urlParams.get('code');
        const targetDate = urlParams.get('date');

        let balls = [], allQuestions = [], filteredPool = [], isRunning = false, sessionName = "";

        async function init() {
            const resp = await fetch(`/api/sessions/${sessionCode}`);
            const data = await resp.json();
            allQuestions = data.questions;
            sessionName = data.session.name;
            document.getElementById('session-title').textContent = sessionName;

            const dates = [...new Set(allQuestions.map(q => new Date(q.createdAt).toLocaleDateString('ja-JP')))].sort().reverse();
            const selector = document.getElementById('date-selector');
            selector.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
            if (targetDate && dates.includes(targetDate)) selector.value = targetDate;

            selector.onchange = () => {
                filteredPool = allQuestions.filter(q => new Date(q.createdAt).toLocaleDateString('ja-JP') === selector.value);
                createBalls();
            };
            selector.onchange();
            resize();
            animate();
        }

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize;

        class Ball {
            constructor(q) {
                this.q = q;
                this.radius = 40 + Math.random() * 20;
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = Math.random() * (canvas.height - this.radius * 2) + this.radius;
                this.dx = (Math.random() - 0.5) * 10;
                this.dy = (Math.random() - 0.5) * 10;
                this.color = `hsl(${Math.random() * 60 + 200}, 55%, 60%)`;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.fillStyle = "#FFFFFF";
                ctx.textAlign = "center";
                ctx.font = "600 12px system-ui, sans-serif";
                const label = this.q.name.substring(0, 5);
                ctx.fillText(label, this.x, this.y + 5);
                ctx.closePath();
            }
            update() {
                if (isRunning) {
                    if (this.x + this.radius > canvas.width || this.x - this.radius < 0) this.dx = -this.dx;
                    if (this.y + this.radius > canvas.height || this.y - this.radius < 0) this.dy = -this.dy;
                    this.x += this.dx; this.y += this.dy;
                }
                this.draw();
            }
        }

        function createBalls() {
            balls = filteredPool.map(q => new Ball(q));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            balls.forEach(ball => ball.update());
            requestAnimationFrame(animate);
        }

        document.getElementById('action-btn').onclick = function() {
            if (!isRunning) {
                isRunning = true; this.textContent = "停！";
            } else {
                stopLottery();
            }
        };

        async function stopLottery() {
            isRunning = false;
            const lucky = balls[Math.floor(Math.random() * balls.length)].q;

            confetti({ particleCount: 200, spread: 90, colors: ['#4A90D9', '#63A9E8', '#FFFFFF'] });

            document.getElementById('lucky-text').textContent = lucky.text;
            document.getElementById('lucky-name').textContent = `提问人：${lucky.name}`;
            document.getElementById('jump-btn').href = `/session/${sessionCode}#q-${lucky._id}`;
            document.getElementById('result-modal').style.display = 'block';

            await fetch('/api/lottery-records', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionName: sessionName,
                    sessionCode: sessionCode,
                    date: document.getElementById('date-selector').value,
                    questionText: lucky.text,
                    userName: lucky.name
                })
            });
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问得好 · 我的仪表盘</title>
    <style>
        :root {
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --text: #1A2332;
            --text-secondary: #6F7B8C;
            --accent: #4A90D9;
            --accent-hover: #3A7BC8;
            --border: #E4E8EE;
            --shadow: 0 2px 12px rgba(0,0,0,0.05);
            --radius: 12px;
            --font: Arial, 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container { max-width: 960px; margin: 0 auto; }
        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
        .header .dot {
            display: inline-block; width: 10px; height: 10px;
            background: var(--accent); border-radius: 50%; margin-left: 4px; vertical-align: super;
        }
        .header .nav-links { display: flex; gap: 16px; }
        .header .nav-links a {
            text-decoration: none; color: var(--text-secondary); font-size: 0.9rem;
            font-weight: 500; padding: 8px 14px; border-radius: 8px;
            border: 1px solid var(--border); transition: all 0.15s;
        }
        .header .nav-links a:hover { border-color: var(--accent); color: var(--accent); }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 32px;
            box-shadow: var(--shadow);
        }
        .card h2 { font-size: 1.3rem; font-weight: 700; margin: 0 0 18px; }
        .create-session-form { display: flex; gap: 12px; }
        #session-name {
            flex-grow: 1; padding: 12px 15px; font-size: 0.95rem;
            border: 1px solid var(--border); border-radius: 10px;
            background-color: var(--bg); color: var(--text);
            outline: none; transition: border-color 0.2s ease;
            font-family: var(--font);
        }
        #session-name:focus { border-color: var(--accent); }
        #create-btn {
            padding: 12px 24px; font-size: 0.95rem; font-weight: 700; border: none;
            border-radius: 10px; background-color: var(--accent); color: white;
            cursor: pointer; transition: background-color 0.2s ease, transform 0.1s ease;
            font-family: var(--font);
        }
        #create-btn:hover { background-color: var(--accent-hover); }
        #create-btn:active { transform: scale(0.98); }
        #create-btn:disabled { background-color: #A0B8D9; cursor: not-allowed; }

        #sessions-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
        .session-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow);
            display: flex; flex-direction: column; gap: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .session-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .session-card h3 { margin: 0; font-size: 1.2rem; font-weight: 600; word-break: break-all; }
        .session-card .code {
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            background-color: var(--bg); padding: 3px 8px; border-radius: 6px;
            font-size: 0.85rem; color: var(--text-secondary);
        }
        .session-card .date { font-size: 0.85rem; color: var(--text-secondary); }
        .session-card .connections { font-size: 0.85rem; color: var(--text-secondary); }
        .session-card .links { margin-top: 12px; display: flex; gap: 10px; }
        .session-card .links a {
            text-decoration: none; padding: 8px 14px; border-radius: 8px;
            font-weight: 600; font-size: 0.85rem; transition: all 0.15s;
        }
        .session-card .links .presenter-link {
            background-color: var(--accent); color: white;
        }
        .session-card .links .presenter-link:hover { background-color: var(--accent-hover); }
        .session-card .links .ask-link {
            background-color: var(--bg); color: var(--text); border: 1px solid var(--border);
        }
        .session-card .links .ask-link:hover { border-color: var(--accent); color: var(--accent); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>问得好<span class="dot"></span></h1>
            <div class="nav-links">
                <a href="/admin">数据导出</a>
                <a href="/records.html">中奖记录</a>
            </div>
        </div>
        <div class="card">
            <h2>创建新场次</h2>
            <div class="create-session-form">
                <input type="text" id="session-name" placeholder="输入课程或活动名称">
                <button id="create-btn">创建</button>
            </div>
        </div>
        <div class="sessions-container">
            <h2 style="font-size:1.15rem;font-weight:600;margin-bottom:16px;">历史场次</h2>
            <div id="sessions-list"></div>
        </div>
    </div>
    <script>
        const createBtn = document.getElementById('create-btn');
        const sessionNameInput = document.getElementById('session-name');
        const sessionsListDiv = document.getElementById('sessions-list');
        async function fetchSessions() {
            try {
                const response = await fetch('/api/sessions');
                if (!response.ok) throw new Error('Failed to fetch sessions');
                const sessions = await response.json();
                sessionsListDiv.innerHTML = '';
                if (sessions.length === 0) {
                    sessionsListDiv.innerHTML = '<p class="empty-state">还没有任何场次，快在上方创建一个吧！</p>';
                    return;
                }
                sessions.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'session-card';
                    const formattedDate = new Date(s.createdAt).toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
                    card.innerHTML = `
                        <h3>${escapeHTML(s.name)}</h3>
                        <p class="date">创建于: ${formattedDate}</p>
                        <p>唯一代码: <span class="code">${s.code}</span></p>
                        <p class="connections"><b>历史总参与人次: ${s.totalConnections || 0}</b></p>
                        <div class="links">
                            <a href="/session/${s.code}" target="_blank" class="presenter-link">打开展示页</a>
                            <a href="/session/${s.code}/ask" target="_blank" class="ask-link">打开提问页</a>
                        </div>
                    `;
                    sessionsListDiv.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching sessions:", error);
                sessionsListDiv.innerHTML = '<p class="empty-state" style="color: #EF4444;">加载历史场次失败。</p>';
            }
        }
        createBtn.addEventListener('click', async () => {
            const name = sessionNameInput.value.trim();
            if (!name) { alert('场次名称不能为空！'); return; }
            createBtn.disabled = true;
            createBtn.textContent = "创建中...";
            try {
                const response = await fetch('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
                if (!response.ok) throw new Error('Creation failed');
                sessionNameInput.value = '';
                await fetchSessions();
            } catch (error) {
                console.error("Error creating session:", error);
                alert('创建失败，请重试。');
            } finally {
                createBtn.disabled = false;
                createBtn.textContent = "创建";
            }
        });
        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match];
            });
        }
        fetchSessions();
    </script>
</body>
</html>

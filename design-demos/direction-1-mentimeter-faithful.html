<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向一 · Mentimeter 正统诠释</title>
<style>
  :root {
    --bg: #FFFFFF;
    --sidebar-bg: #F7F7F8;
    --card-bg: #FFFFFF;
    --text: #2D3436;
    --text-secondary: #6B7280;
    --accent: #FF6B6B;
    --accent-hover: #E85D5D;
    --border: #E8E8EC;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 14px;
    --font: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }
  .sidebar {
    width: 280px;
    background: var(--sidebar-bg);
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .session-name {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }
  .qr-section {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    margin-bottom: 24px;
  }
  .qr-placeholder {
    width: 120px;
    height: 120px;
    background: #F0F0F3;
    border-radius: 10px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    color: #999;
  }
  .qr-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .mode-section {
    margin-bottom: auto;
  }
  .mode-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .mode-select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.9rem;
    font-family: var(--font);
    background: #FFFFFF;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  .mode-select:focus {
    border-color: var(--accent);
  }
  .live-counter {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .live-number {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }
  .live-label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .card-wall {
    flex: 1;
    padding: 36px;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 20px;
    overflow-y: auto;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: calc(33.333% - 14px);
    min-width: 300px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    position: relative;
    animation: fadeIn 0.4s ease;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .card .question {
    font-size: 1.05rem;
    line-height: 1.6;
    flex: 1;
    margin-bottom: 16px;
    color: var(--text);
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }
  .card-footer .author {
    font-weight: 600;
    color: var(--text);
  }
  .delete-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.05);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.2s;
  }
  .card:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { background: var(--accent); color: white; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">问得好</div>
  <div class="session-name">产品发布会 Q&A</div>
  <div class="qr-section">
    <div class="qr-placeholder">扫码提问</div>
    <div class="qr-label">扫描二维码加入互动</div>
  </div>
  <div class="mode-section">
    <label class="mode-label">抽奖模式</label>
    <select class="mode-select">
      <option>&#x1f383; 翻卡片模式</option>
      <option>&#x26bd; 物理碰撞球</option>
    </select>
  </div>
  <div class="live-counter">
    <span class="live-number">12</span>
    <span class="live-label">在线参与</span>
  </div>
</div>
<div class="card-wall">
  <div class="card">
    <button class="delete-btn">&times;</button>
    <div class="question">这个产品的定价策略是怎样的？面向企业还是个人用户？</div>
    <div class="card-footer">
      <span>14:32</span>
      <span class="author">张三</span>
    </div>
  </div>
  <div class="card">
    <button class="delete-btn">&times;</button>
    <div class="question">后续会有移动端 App 的规划吗？现在用网页版还是不太方便</div>
    <div class="card-footer">
      <span>14:35</span>
      <span class="author">李四</span>
    </div>
  </div>
  <div class="card">
    <button class="delete-btn">&times;</button>
    <div class="question">能不能讲一下技术架构？后端用的是什么框架？</div>
    <div class="card-footer">
      <span>14:38</span>
      <span class="author">王五</span>
    </div>
  </div>
  <div class="card">
    <button class="delete-btn">&times;</button>
    <div class="question">团队目前有多少人？研发和产品的比例大概是多少？</div>
    <div class="card-footer">
      <span>14:41</span>
      <span class="author">赵六</span>
    </div>
  </div>
  <div class="card">
    <button class="delete-btn">&times;</button>
    <div class="question">竞品分析做了吗？相比市面上已有的方案有什么差异化优势？</div>
    <div class="card-footer">
      <span>14:44</span>
      <span class="author">匿名</span>
    </div>
  </div>
  <div class="card">
    <button class="delete-btn">&times;</button>
    <div class="question">什么时候开始内测？我们可以参与吗？</div>
    <div class="card-footer">
      <span>14:47</span>
      <span class="author">匿名</span>
    </div>
  </div>
</div>
</body>
</html>

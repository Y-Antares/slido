<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动问题墙</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator/qrcode.js"></script>
    <style>
        :root {
            --bg: #F5F7FA;
            --sidebar-bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --text: #1A2332;
            --text-secondary: #6F7B8C;
            --accent: #4A90D9;
            --accent-hover: #3A7BC8;
            --border: #E4E8EE;
            --shadow: 0 2px 12px rgba(0,0,0,0.05);
            --radius: 12px;
            --font: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        .container { display: flex; height: 100vh; }

        .sidebar {
            width: 280px;
            padding: 28px 22px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }
        .sidebar h2 {
            margin: 0 0 4px;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
        }
        .session-subtitle {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 22px;
        }

        #qrcode-container {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 18px;
            text-align: center;
            margin-bottom: 20px;
        }
        #qrcode-container p {
            color: var(--text-secondary);
            margin: 0 0 10px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        #qrcode img { max-width: 100%; height: auto; display: block; margin: 0 auto; }

        #qrcode-actions { display: flex; gap: 8px; margin-top: 10px; }
        #qrcode-actions button {
            flex: 1; padding: 7px; font-size: 0.78rem; border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); cursor: pointer; font-weight: 600;
            transition: all 0.15s; background: #FFFFFF;
        }
        #copy-qr-btn:hover, #download-qr-btn:hover { border-color: var(--accent); color: var(--accent); }

        .mode-selector {
            padding: 14px;
            background: var(--bg);
            border-radius: var(--radius);
            margin-bottom: auto;
        }
        .mode-selector label {
            display: block; font-size: 0.7rem; color: var(--text-secondary);
            margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .mode-selector select {
            width: 100%; padding: 9px 12px; background: #FFFFFF;
            color: var(--text); border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; outline: none; font-size: 0.88rem; font-family: var(--font);
        }
        .mode-selector select:focus { border-color: var(--accent); }

        .live-counter {
            padding-top: 18px; border-top: 1px solid var(--border);
            display: flex; align-items: baseline; gap: 8px;
        }
        .live-counter-number {
            font-size: 2.2rem; font-weight: 800; color: var(--accent); line-height: 1;
        }
        .live-counter-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }

        .card-wall {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 18px;
            overflow-y: auto;
            padding: 30px;
        }
        .card-wall::-webkit-scrollbar { width: 6px; }
        .card-wall::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

        .card {
            position: relative;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius);
            padding: 22px;
            width: calc(33.333% - 12px);
            min-width: 280px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transition: transform 0.2s ease, box-shadow 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-color: rgba(74,144,217,0.3);
        }
        .card .question-text {
            font-size: 1.1rem; line-height: 1.6; word-wrap: break-word;
            flex-grow: 1; font-weight: 500;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }
        .timestamp { font-size: 0.75rem; }
        .author-name { font-weight: 600; color: var(--text); }

        .delete-btn {
            position: absolute; top: 12px; right: 12px; width: 26px; height: 26px;
            border-radius: 50%; border: none; background-color: rgba(0,0,0,0.04);
            color: var(--text-secondary); cursor: pointer; opacity: 0;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
        }
        .card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background-color: #EF4444; color: white; }

        .lottery-link-btn {
            margin-top: 12px; padding: 8px;
            border: 1px solid rgba(74,144,217,0.3);
            background: rgba(74,144,217,0.04); color: var(--accent);
            border-radius: 8px; cursor: pointer; font-size: 0.82rem;
            font-weight: 600; transition: all 0.2s; text-align: center;
        }
        .lottery-link-btn:hover { background: var(--accent); color: white; }

        .card.deleting { opacity: 0; transform: scale(0.9); transition: all 0.3s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) { .card { width: calc(50% - 9px); } }
        @media (max-width: 768px) {
            body { overflow: auto; height: auto; }
            .container { flex-direction: column; height: auto; }
            .sidebar { width: auto; }
            .card-wall { overflow-y: visible; }
            .card { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2 id="session-title">加载中...</h2>
            <div class="session-subtitle">实时问答互动</div>
            <div id="qrcode-container">
                <p>扫码加入互动</p>
                <div id="qrcode"></div>
                <div id="qrcode-actions">
                    <button id="copy-qr-btn">复制</button>
                    <button id="download-qr-btn">下载</button>
                </div>
            </div>

            <div class="mode-selector">
                <label>抽奖模式</label>
                <select id="lottery-mode-select">
                    <option value="lottery-flip.html">翻卡片</option>
                    <option value="lottery-ball.html">碰撞球</option>
                </select>
            </div>

            <div class="live-counter">
                <div id="client-count" class="live-counter-number">0</div>
                <div class="live-counter-label">在线参与</div>
            </div>
        </div>
        <div id="card-wall" class="card-wall"></div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const sessionCode = pathParts[pathParts.length - 1];
        const clientUrl = `${window.location.protocol}//${window.location.host}/session/${sessionCode}/ask`;

        const modeSelect = document.getElementById('lottery-mode-select');
        const savedMode = localStorage.getItem('lottery_mode');
        if (savedMode) modeSelect.value = savedMode;
        modeSelect.onchange = (e) => localStorage.setItem('lottery_mode', e.target.value);

        try {
            const qr = qrcode(4, 'L');
            qr.addData(clientUrl);
            qr.make();
            document.getElementById('qrcode').innerHTML = qr.createImgTag(5, 5);
        } catch (e) { document.getElementById('qrcode').textContent = "二维码错误"; }

        const qrImgElement = document.querySelector('#qrcode img');
        document.getElementById('copy-qr-btn').onclick = async () => {
            try {
                const response = await fetch(qrImgElement.src);
                const blob = await response.blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                alert('已复制二维码！');
            } catch (err) { alert('复制失败'); }
        };
        document.getElementById('download-qr-btn').onclick = () => {
            const link = document.createElement('a');
            link.href = qrImgElement.src;
            link.download = `qr-${sessionCode}.png`;
            link.click();
        };

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}`;
        let ws;
        function connectWebSocket() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'join', room: sessionCode }));
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'new_question') {
                        createQuestionCard(data.payload);
                    } else if (data.type === 'client_count_update') {
                        document.getElementById('client-count').textContent = data.count;
                    } else if (data.type === 'question_deleted') {
                        const card = document.querySelector(`.card[data-question-id="${data.payload.questionId}"]`);
                        if (card) { card.classList.add('deleting'); setTimeout(() => card.remove(), 300); }
                    }
                } catch (e) { console.error(e); }
            };
            ws.onclose = () => setTimeout(connectWebSocket, 1000);
        }

        function createQuestionCard(questionData) {
            const wall = document.getElementById('card-wall');
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.questionId = questionData._id;
            card.id = `q-${questionData._id}`;

            const text = document.createElement('div');
            text.className = 'question-text';
            text.textContent = questionData.text;

            const footer = document.createElement('div');
            footer.className = 'card-footer';

            const time = document.createElement('span');
            time.className = 'timestamp';
            if (questionData.createdAt) {
                time.textContent = new Date(questionData.createdAt).toLocaleTimeString('ja-JP', {
                    hour: '2-digit', minute: '2-digit', hour12: false
                });
            }

            const author = document.createElement('span');
            author.className = 'author-name';
            author.textContent = questionData.name;

            footer.appendChild(time);
            footer.appendChild(author);

            const lotteryBtn = document.createElement('button');
            lotteryBtn.className = 'lottery-link-btn';
            lotteryBtn.textContent = '针对本场抽奖';
            lotteryBtn.onclick = () => {
                const qDate = new Date(questionData.createdAt).toLocaleDateString('ja-JP');
                window.location.href = `/${modeSelect.value}?code=${sessionCode}&date=${qDate}`;
            };

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '&times;';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if (confirm('确定删除此问题？')) {
                    fetch(`/api/questions/${questionData._id}`, { method: 'DELETE' });
                }
            };

            card.appendChild(delBtn);
            card.appendChild(text);
            card.appendChild(footer);
            card.appendChild(lotteryBtn);
            wall.prepend(card);
        }

        async function loadInitialData() {
            try {
                const response = await fetch(`/api/sessions/${sessionCode}`);
                const data = await response.json();
                document.getElementById('session-title').textContent = data.session.name;
                data.questions.forEach(createQuestionCard);

                if (window.location.hash) {
                    setTimeout(() => {
                        const target = document.querySelector(window.location.hash);
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            target.style.borderColor = '#4A90D9';
                            target.style.boxShadow = '0 0 30px rgba(74, 144, 217, 0.3)';
                            setTimeout(() => {
                                target.style.borderColor = '';
                                target.style.boxShadow = '';
                            }, 3000);
                        }
                    }, 400);
                }
            } catch(e) { console.error(e); }
        }

        loadInitialData();
        connectWebSocket();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>互动气泡抽奖</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #F5F7FA;
            --text: #1A2332;
            --text-secondary: #6F7B8C;
            --accent: #4A90D9;
            --border: #E4E8EE;
            --font: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0; background-color: var(--bg); color: var(--text);
            font-family: var(--font); overflow: hidden;
        }
        .floating-sidebar {
            position: absolute; left: 16px; top: 90px; bottom: 90px; width: 190px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
            border: 1px solid var(--border); border-radius: 14px;
            padding: 14px; z-index: 20; display: flex; flex-direction: column;
        }
        .sidebar-header { color: var(--accent); font-size: 0.85rem; font-weight: 700; border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 10px; }
        .p-list { flex-grow: 1; overflow-y: auto; font-size: 0.82rem; color: var(--text); margin: 0; padding: 0; list-style: none; }
        .p-list li { margin-bottom: 5px; opacity: 0.85; }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        .header {
            position: relative; padding: 16px; z-index: 10; text-align: center;
            pointer-events: none;
        }
        .header * { pointer-events: auto; }
        .header h2 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
        select {
            padding: 6px 12px; border-radius: 8px; background: #FFFFFF;
            color: var(--text); border: 1px solid var(--border); font-family: var(--font); font-size: 0.85rem;
        }
        select:focus { border-color: var(--accent); outline: none; }
        .ui-layer { position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); z-index: 10; }
        button#action-btn {
            padding: 12px 36px; font-size: 1.05rem; background: var(--accent);
            color: white; border: none; border-radius: 50px; cursor: pointer;
            font-weight: 700; font-family: var(--font);
            box-shadow: 0 4px 16px rgba(74,144,217,0.3); transition: all 0.15s;
        }
        button#action-btn:hover { background: #3A7BC8; }
        #result-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #FFFFFF; color: var(--text);
            padding: 30px; border-radius: 16px; width: 480px; text-align: center;
            z-index: 100; border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        .btn-link {
            background: var(--accent); color: white; text-decoration: none;
            padding: 10px 18px; border-radius: 8px; margin: 5px;
            display: inline-block; font-weight: 600; font-size: 0.85rem; transition: all 0.15s;
        }
        .btn-link:hover { background: #3A7BC8; }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="session-title">加载中...</h2>
        日期：<select id="date-selector"></select>
    </div>

    <div class="floating-sidebar">
        <div class="sidebar-header" id="sidebar-header">有效抽奖 (0)</div>
        <ul id="p-list" class="p-list"></ul>
    </div>

    <canvas id="ballCanvas"></canvas>

    <div class="ui-layer"><button id="action-btn">开始碰撞</button></div>

    <div id="result-modal">
        <h2 style="color: #4A90D9;">抽中啦！</h2>
        <div id="lucky-text" style="font-size: 1.2rem; margin: 20px 0; line-height:1.5;"></div>
        <div id="lucky-name" style="color: #4A90D9; font-weight: bold;"></div>
        <div style="margin-top: 22px;">
            <a href="#" id="jump-btn" class="btn-link">展示墙定位</a>
            <a href="/records.html" class="btn-link" style="background:#6F7B8C;">查看记录</a>
            <button onclick="location.reload()" style="padding:10px 18px; border:1px solid #E4E8EE; background:#FFF; cursor:pointer; border-radius:8px; font-family:var(--font); font-size:0.85rem;">再抽一次</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ballCanvas');
        const ctx = canvas.getContext('2d');
        const urlParams = new URLSearchParams(window.location.search);
        const sessionCode = urlParams.get('code');
        const targetDate = urlParams.get('date');
        let balls = [], allQuestions = [], filteredPool = [], isRunning = false, sessionName = "";

        function calculateDifference(s1, s2) {
            const len1 = s1.length, len2 = s2.length;
            const matrix = Array.from({ length: len1 + 1 }, () => []);
            for (let i = 0; i <= len1; i++) matrix[i][0] = i;
            for (let j = 0; j <= len2; j++) matrix[0][j] = j;
            for (let i = 1; i <= len1; i++) {
                for (let j = 1; j <= len2; j++) {
                    const cost = s1[i-1] === s2[j-1] ? 0 : 1;
                    matrix[i][j] = Math.min(matrix[i-1][j]+1, matrix[i][j-1]+1, matrix[i-1][j-1]+cost);
                }
            }
            return Math.max(len1, len2) === 0 ? 0 : matrix[len1][len2] / Math.max(len1, len2);
        }

        async function init() {
            const resp = await fetch(`/api/sessions/${sessionCode}`);
            const data = await resp.json();
            allQuestions = data.questions;
            sessionName = data.session.name;
            document.getElementById('session-title').textContent = sessionName;

            const dates = [...new Set(allQuestions.map(q => new Date(q.createdAt).toLocaleDateString('ja-JP')))].sort().reverse();
            const selector = document.getElementById('date-selector');
            selector.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
            if (targetDate && dates.includes(targetDate)) selector.value = targetDate;

            selector.onchange = () => {
                const raw = allQuestions.filter(q => new Date(q.createdAt).toLocaleDateString('ja-JP') === selector.value);
                processPool(raw);
            };
            selector.onchange(); resize(); animate();
        }

        function processPool(raw) {
            const grouped = {};
            raw.forEach(q => {
                if (!grouped[q.name]) grouped[q.name] = [];
                if (!grouped[q.name].some(ext => calculateDifference(ext.text, q.text) <= 0.25)) {
                    grouped[q.name].push(q);
                }
            });
            filteredPool = Object.values(grouped).flat();
            document.getElementById('sidebar-header').textContent = `有效抽奖 (${filteredPool.length})`;
            document.getElementById('p-list').innerHTML = Object.entries(grouped)
                .map(([name, qs]) => `<li>${name} (${qs.length})</li>`).join('');
            balls = filteredPool.map(q => new Ball(q));
        }

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize;

        class Ball {
            constructor(q) {
                this.q = q; this.radius = 40 + Math.random() * 20;
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = Math.random() * (canvas.height - 100) + 50;
                this.dx = (Math.random() - 0.5) * 10; this.dy = (Math.random() - 0.5) * 10;
                this.color = `hsl(${Math.random() * 60 + 200}, 55%, 60%)`;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.fillStyle = "#FFFFFF";
                ctx.textAlign = "center"; ctx.font = "600 12px system-ui, sans-serif";
                ctx.fillText(this.q.name.substring(0,6), this.x, this.y + 5);
                ctx.closePath();
            }
            update() {
                if (isRunning) {
                    if (this.x + this.radius > canvas.width || this.x - this.radius < 0) this.dx = -this.dx;
                    if (this.y + this.radius > canvas.height || this.y - this.radius < 0) this.dy = -this.dy;
                    this.x += this.dx; this.y += this.dy;
                }
                this.draw();
            }
        }

        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); balls.forEach(b => b.update()); requestAnimationFrame(animate); }

        document.getElementById('action-btn').onclick = function() {
            if (!isRunning) { isRunning = true; this.textContent = "停！"; this.style.background = "#EF4444"; }
            else { stopLottery(); }
        };

        async function stopLottery() {
            isRunning = false;
            document.getElementById('action-btn').style.background = '#4A90D9';
            const lucky = balls[Math.floor(Math.random() * balls.length)].q;
            confetti({ particleCount: 200, spread: 90, colors: ['#4A90D9', '#63A9E8', '#FFFFFF'] });
            document.getElementById('lucky-text').textContent = lucky.text;
            document.getElementById('lucky-name').textContent = `提问人：${lucky.name}`;
            document.getElementById('jump-btn').href = `/session/${sessionCode}#q-${lucky._id}`;
            document.getElementById('result-modal').style.display = 'block';
            await fetch('/api/lottery-records', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionName, sessionCode, date: document.getElementById('date-selector').value,
                    questionText: lucky.text, userName: lucky.name
                })
            });
        }
        init();
    </script>
</body>
</html>

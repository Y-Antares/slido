<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>提交成功</title>
    <style>
        :root {
            --bg: #F5F7FA;
            --accent: #4A90D9;
            --accent-hover: #3A7BC8;
            --text: #1A2332;
            --text-secondary: #6F7B8C;
            --font: Arial, 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background-color: var(--bg);
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .container {
            background: #FFFFFF; padding: 40px; border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            border: 1px solid #E4E8EE;
            width: 90%; max-width: 400px; text-align: center;
        }
        .brand {
            font-size: 1.4rem; font-weight: 700; color: var(--accent);
            white-space: nowrap; margin-bottom: 20px;
        }
        h1 { color: var(--text); margin: 0 0 8px; font-size: 1.3rem; font-weight: 700; }
        p { color: var(--text-secondary); font-size: 0.92rem; margin-bottom: 28px; }
        .btn {
            display: inline-block; width: 100%; padding: 14px; border: none;
            background-color: var(--accent); color: white; font-size: 1rem;
            font-weight: 600; border-radius: 10px; cursor: pointer;
            text-decoration: none; transition: background-color 0.15s;
            font-family: var(--font);
        }
        .btn:hover { background-color: var(--accent-hover); }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">问得好！</div>
        <h1>提交成功</h1>
        <p>你的问题已经成功发送到大屏幕展示墙</p>
        <a href="#" id="back-btn" class="btn">继续提问</a>
    </div>
    <script>
        const pathParts = window.location.pathname.split('/');
        const sessionCode = pathParts[pathParts.length - 2];
        document.getElementById('back-btn').href = `/session/${sessionCode}/ask`;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>互动翻牌抽奖</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --text: #1A2332;
            --text-secondary: #6F7B8C;
            --accent: #4A90D9;
            --border: #E4E8EE;
            --radius: 10px;
            --font: Arial, 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0; background-color: var(--bg); color: var(--text);
            font-family: var(--font); display: flex; height: 100vh; overflow: hidden;
        }
        .stats-sidebar {
            width: 220px; background: #FFFFFF; border-right: 1px solid var(--border);
            padding: 20px; display: flex; flex-direction: column;
        }
        .stats-sidebar h3 { font-size: 0.88rem; color: var(--accent); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--accent); }
        .participant-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: var(--text-secondary); }
        .participant-list li { padding: 7px 0; border-bottom: 1px solid var(--border); }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 24px; overflow-y: auto; }
        .setup-area { margin-bottom: 18px; text-align: center; }
        .setup-area h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
        select {
            padding: 7px 12px; border-radius: 8px; background: #FFFFFF;
            color: var(--text); border: 1px solid var(--border); font-family: var(--font); font-size: 0.88rem;
        }
        select:focus { border-color: var(--accent); outline: none; }
        .card-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px; width: 100%; margin-top: 16px;
        }
        .flip-card { width: 130px; height: 160px; perspective: 1000px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.6s; transform-style: preserve-3d; border-radius: var(--radius);
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: var(--radius); display: flex; align-items: center;
            justify-content: center; padding: 10px; box-sizing: border-box;
        }
        .flip-card-front {
            background: #FFFFFF; border: 2px solid var(--accent); color: var(--accent); font-size: 2.2rem;
        }
        .flip-card-back {
            background-color: #FFFFFF; color: var(--text); transform: rotateY(180deg);
            flex-direction: column; font-size: 0.8rem; border: 2px solid var(--accent);
        }
        .winner-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 420px; background: #FFFFFF;
            color: var(--text); padding: 30px; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12); z-index: 100; text-align: center;
            border: 1px solid var(--border);
        }
        .btn-link {
            display: inline-block; margin: 8px 5px; background: var(--accent);
            color: white; text-decoration: none; padding: 10px 18px;
            border-radius: 8px; font-weight: 600; font-size: 0.88rem; transition: all 0.15s;
        }
        .btn-link:hover { background: #3A7BC8; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; }
    </style>
</head>
<body>
    <div class="stats-sidebar">
        <h3 id="sidebar-title">有效参与者 (0)</h3>
        <ul id="participant-list" class="participant-list"></ul>
    </div>

    <div class="main-content">
        <div class="setup-area">
            <h2 id="session-title">正在加载...</h2><p>选择场次：每人一份资格。</p>
            日期：<select id="date-selector"></select>
            时段：<select id="period-selector">
                <option value="all">全天</option>
                <option value="am">上午</option>
                <option value="pm">下午</option>
            </select>
        </div>
        <div class="card-grid" id="card-grid"></div>
        <button onclick="window.history.back()" style="margin-top:20px; background:none; border:1px solid #E4E8EE; color:#6F7B8C; cursor:pointer; padding:10px 20px; border-radius:50px; font-family:var(--font);">← 返回展示页</button>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="winner-modal" id="winner-modal">
        <h2 id="winner-title" style="color: #4A90D9;">恭喜中奖！</h2>
        <div id="winner-content" style="margin: 15px 0; font-size: 1.1rem; line-height:1.5;"></div>
        <div id="winner-name" style="color: #4A90D9; font-weight: bold;"></div>
        <div style="margin-top: 20px;">
            <a href="#" id="jump-btn" class="btn-link">定位问题</a>
            <a href="/records.html" class="btn-link" style="background:#6F7B8C;">查看记录</a>
        </div>
        <button onclick="closeModal()" style="margin-top:10px; border:1px solid #E4E8EE; background:#FFF; color:#6F7B8C; cursor:pointer; padding:8px 18px; border-radius:8px; font-family:var(--font);">关闭</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionCode = urlParams.get('code');
        const targetDate = urlParams.get('date');
        const periodSelector = document.getElementById('period-selector');
        periodSelector.value = ['am', 'pm'].includes(urlParams.get('period')) ? urlParams.get('period') : 'all';
        let loadVersion = 0, animationStarted = false, winnerTimer = null;
        let allQuestions = [], filteredPool = [], sessionName = "";

        function chinaDate(value) {
            return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai',
                year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(value)).replace(/-/g, '/');
        }
        function escapeHTML(value) {
            const el = document.createElement('span');
            el.textContent = String(value);
            return el.innerHTML;
        }

        function showError(error) {
            document.getElementById('session-title').textContent = error.message;
            const button = document.getElementById('action-btn');
            if (button) button.disabled = true;
        }
        function resetDisplay() {
            clearTimeout(winnerTimer);
            const button = document.getElementById('action-btn');
            if (button) { isRunning = false; button.textContent = '开始碰撞'; button.style.background = '#4A90D9'; }
            for (const id of ['winner-modal', 'overlay', 'result-modal']) {
                const modal = document.getElementById(id);
                if (modal) modal.style.display = 'none';
            }
        }
        function updatePool() {
            resetDisplay();
            const date = document.getElementById('date-selector').value;
            const raw = allQuestions.filter(q => chinaDate(q.createdAt) === date);
            processPool(raw);
            const label = periodSelector.options[periodSelector.selectedIndex].text;
            document.getElementById('session-title').textContent = `${sessionName} · ${date || '暂无日期'} · ${label}${raw.length ? '' : '（暂无有效参与者）'}`;
        }
        async function init() {
            const version = ++loadVersion;
            const period = periodSelector.value;
            const selector = document.getElementById('date-selector');
            const preferredDate = selector.value || targetDate;
            selector.disabled = true;
            // 加载期间清空旧名单，不能用旧时段名单在新筛选条件下抽奖。
            allQuestions = [];
            updatePool();
            document.getElementById('session-title').textContent = '正在加载抽奖名单…';
            try {
                const resp = await fetch(`/api/sessions/${sessionCode}/lottery-pool?period=${period}`);
                const data = await resp.json();
                if (version !== loadVersion) return;
                if (!resp.ok) throw new Error(data.message || '获取名单失败');
                allQuestions = data.questions;
                sessionName = data.session.name;
                const dates = data.dates;
                selector.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
                if (preferredDate && dates.includes(preferredDate)) selector.value = preferredDate;
                updatePool();
                
            } catch (error) { if (version === loadVersion) showError(error); }
            finally { if (version === loadVersion) selector.disabled = false; }
        }
        periodSelector.onchange = init;
        document.getElementById('date-selector').onchange = updatePool;

        function processPool(raw) {
            filteredPool = raw.slice();
            // 打乱卡片顺序，避免按提交时间排列泄露人选位置。
            for (let i = filteredPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredPool[i], filteredPool[j]] = [filteredPool[j], filteredPool[i]];
            }
            document.getElementById('sidebar-title').textContent = `有效参与者 (${filteredPool.length})`;
            document.getElementById('participant-list').innerHTML = filteredPool
                .map(q => `<li>${escapeHTML(q.name)}（1份资格）</li>`).join('');
            renderCards();
        }

        function renderCards() {
            document.getElementById('card-grid').innerHTML = filteredPool.map((q, index) => `
                <div class="flip-card" onclick="flipCard(this, ${index})">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">?</div>
                        <div class="flip-card-back">
                            <div style="font-weight:bold; margin-bottom:5px;">${escapeHTML(q.text.substring(0,18))}...</div>
                            <div style="color:#4A90D9;">${escapeHTML(q.name)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function flipCard(el, idx) {
            if (el.classList.contains('flipped')) return;
            el.classList.add('flipped');
            const lucky = filteredPool[idx];
            const drawDate = document.getElementById('date-selector').value;
            const drawPeriod = periodSelector.value;
            confetti({ particleCount: 100, spread: 70, colors: ['#4A90D9', '#63A9E8', '#FFFFFF'] });

            winnerTimer = setTimeout(() => {
                document.getElementById('winner-title').textContent = `恭喜${lucky.name}同学！`;
                document.getElementById('winner-content').textContent = lucky.text;
                document.getElementById('winner-name').textContent = `— ${lucky.name}`;
                document.getElementById('jump-btn').href = `/session/${sessionCode}#q-${lucky._id}`;
                document.getElementById('winner-modal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            }, 600);

            try {
                const recordResponse = await fetch('/api/lottery-records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionName, sessionCode, date: drawDate, period: drawPeriod,
                        questionId: lucky._id, questionText: lucky.text, userName: lucky.name
                    })
                });
                if (!recordResponse.ok) throw new Error('保存失败');
            } catch (_) { alert('已抽出结果，但中奖记录保存失败，请手动记录。'); }
        }

        function closeModal() { document.getElementById('winner-modal').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }
        init().catch(error => {
            document.getElementById('session-title').textContent = error.message;
            const button = document.getElementById('action-btn');
            if (button) button.disabled = true;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>提问</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; }
        h1 { text-align: center; margin-top: 0; }
        input[type="text"] { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
        
        .textarea-container { position: relative; margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 10px; padding-bottom: 40px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; resize: vertical; }
        
        .mic-btn { position: absolute; right: 10px; bottom: 12px; border: none; background-color: #e9ecef; color: #495057; border-radius: 20px; padding: 6px 12px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .mic-btn:hover { background-color: #dee2e6; }
        .mic-btn.recording { background-color: #dc3545; color: white; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }

        button[type="submit"] { width: 100%; padding: 15px; border: none; background-color: #007bff; color: white; font-size: 18px; border-radius: 5px; cursor: pointer; }
        button[type="submit"]:hover { background-color: #0056b3; }
        .message { text-align: center; color: green; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>输入你的问题</h1>
        <form id="question-form">
            <input type="text" id="name-input" placeholder="你的名字 (选填)">
            <div class="textarea-container">
                <textarea id="question-input" placeholder="请在这里输入..." required></textarea>
                <button type="button" id="mic-btn" class="mic-btn">🎤 语音输入</button>
            </div>
            <button type="submit">提交</button>
        </form>
        <p id="message" class="message"></p>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const sessionCode = pathParts[pathParts.length - 1];

        const form = document.getElementById('question-form');
        const nameInput = document.getElementById('name-input');
        const questionInput = document.getElementById('question-input');
        const messageEl = document.getElementById('message');
        const micBtn = document.getElementById('mic-btn');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        micBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstart = () => {
                        isRecording = true;
                        micBtn.textContent = '🛑 录音中...点击停止';
                        micBtn.classList.add('recording');
                    };

                    mediaRecorder.onstop = async () => {
                        micBtn.textContent = '⏳ 识别中...';
                        micBtn.classList.remove('recording');
                        micBtn.disabled = true;

                        const audioBlob = new Blob(audioChunks);
                        const formData = new FormData();
                        formData.append('audio', audioBlob, 'record.webm');

                        try {
                            const response = await fetch('/api/voice-to-text', {
                                method: 'POST',
                                body: formData
                            });
                            const data = await response.json();
                            if (response.ok) {
                                questionInput.value += data.text;
                            } else {
                                alert(data.message || '识别失败');
                            }
                        } catch (err) {
                            alert('网络请求失败');
                        } finally {
                            isRecording = false;
                            micBtn.textContent = '🎤 语音输入';
                            micBtn.disabled = false;
                        }
                        
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                } catch (err) {
                    alert('获取麦克风权限失败，请确保在微信或浏览器中已授权。');
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = questionInput.value.trim();
            const name = nameInput.value.trim();

            if (!question) return;

            try {
                const response = await fetch(`/api/ask/${sessionCode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, name: name })
                });

                if (response.ok) {
                    questionInput.value = '';
                    messageEl.textContent = '✅ 提交成功！';
                    setTimeout(() => messageEl.textContent = '', 2000);
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.message || '提交失败');
                }
            } catch (error) {
                messageEl.textContent = `❌ ${error.message}`;
                messageEl.style.color = 'red';
                setTimeout(() => {
                    messageEl.textContent = '';
                    messageEl.style.color = 'green';
                }, 3000);
            }
        });
    </script>
</body>
</html>

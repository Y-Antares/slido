<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>问题管理后台</title>
    <style>
        :root {
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --text: #1A2332;
            --text-secondary: #6F7B8C;
            --accent: #4A90D9;
            --border: #E4E8EE;
            --radius: 10px;
            --font: Arial, 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            padding: 40px 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header {
            display: flex; align-items: baseline; justify-content: space-between;
            margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
        }
        .header h1 { font-size: 1.6rem; font-weight: 700; }
        .header a {
            text-decoration: none; color: var(--text-secondary); font-size: 0.9rem;
            font-weight: 500; padding: 8px 14px; border-radius: 8px;
            border: 1px solid var(--border); transition: all 0.15s;
        }
        .header a:hover { border-color: var(--accent); color: var(--accent); }
        .controls {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; margin-bottom: 24px;
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .controls label { font-size: 0.88rem; font-weight: 600; color: var(--text-secondary); }
        .controls input[type="datetime-local"] {
            padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 0.9rem; font-family: var(--font); background: var(--bg); color: var(--text);
            outline: none;
        }
        .controls input[type="datetime-local"]:focus { border-color: var(--accent); }
        .controls button {
            padding: 9px 18px; border: none; border-radius: 8px; font-size: 0.9rem;
            font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: var(--font);
        }
        #fetch-btn { background: var(--accent); color: white; }
        #fetch-btn:hover { background: #3A7BC8; }
        #export-btn { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        #export-btn:hover { border-color: var(--accent); color: var(--accent); }
        table {
            width: 100%; border-collapse: collapse; background: var(--card-bg);
            border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
        }
        th {
            background: #EDF0F5; color: var(--text); padding: 12px 14px;
            text-align: left; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.3px;
        }
        td {
            border-top: 1px solid var(--border); padding: 12px 14px;
            font-size: 0.9rem; color: var(--text);
        }
        tr:nth-child(even) td { background: #FAFBFC; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>问题数据导出</h1>
            <a href="/">← 返回仪表盘</a>
        </div>
        <div class="controls">
            <label for="start-time">开始时间:</label>
            <input type="datetime-local" id="start-time">
            <label for="end-time">结束时间:</label>
            <input type="datetime-local" id="end-time">
            <button id="fetch-btn">获取问题</button>
            <button id="export-btn" style="display:none;">导出为 CSV</button>
        </div>
        <table id="questions-table">
            <thead>
                <tr>
                    <th>时间</th>
                    <th>提问人</th>
                    <th>问题内容</th>
                    <th>IP 地址</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const fetchBtn = document.getElementById('fetch-btn');
        const exportBtn = document.getElementById('export-btn');
        const tableBody = document.querySelector('#questions-table tbody');
        let currentQuestions = [];

        fetchBtn.addEventListener('click', async () => {
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;
            if (!startTime || !endTime) { alert('请选择开始和结束时间'); return; }
            const startISO = new Date(startTime).toISOString();
            const endISO = new Date(endTime).toISOString();
            try {
                const response = await fetch(`/api/questions?start=${startISO}&end=${endISO}`);
                if (!response.ok) throw new Error('网络响应错误');
                currentQuestions = await response.json();
                renderTable(currentQuestions);
            } catch (error) {
                console.error('获取失败:', error);
                alert('获取问题失败');
            }
        });

        function renderTable(questions) {
            tableBody.innerHTML = '';
            if (questions.length === 0) {
                exportBtn.style.display = 'none';
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#6F7B8C;">该时间段内没有问题。</td></tr>';
                return;
            }
            questions.forEach(q => {
                const row = tableBody.insertRow();
                const localTime = new Date(q.createdAt).toLocaleString('ja-JP', { hour12: false });
                row.insertCell(0).textContent = localTime;
                row.insertCell(1).textContent = q.name;
                row.insertCell(2).textContent = q.text;
                row.insertCell(3).textContent = q.ipAddress || 'N/A';
            });
            exportBtn.style.display = 'inline-block';
        }

        exportBtn.addEventListener('click', () => {
            if (currentQuestions.length === 0) return;
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF时间,提问人,问题内容,IP 地址\n";
            currentQuestions.forEach(q => {
                const time = '"' + new Date(q.createdAt).toLocaleString('ja-JP', { hour12: false }) + '"';
                const name = '"' + q.name + '"';
                const text = '"' + q.text.replace(/"/g, '""') + '"';
                const ip = '"' + (q.ipAddress || '') + '"';
                csvContent += [time, name, text, ip].join(',') + "\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "questions_export.csv");
            document.body.appendChild(link);
            link.click();
            link.remove();
        });
    </script>
</body>
</html>
